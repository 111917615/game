<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabrye's Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0f2e;--card:#2b1850;--ink:#fff4e6;--gold:#ffcf5c;--pink:#ff7fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#4a2272 0,#1a0f2e 60%) fixed,#1a0f2e;color:var(--ink);font-family:'Silkscreen','Courier New',monospace}
button{font-family:inherit;font-weight:700;font-size:13px;background:var(--pink);color:#2b0f2b;border:0;border-bottom:4px solid #b84a74;border-radius:6px;padding:9px 16px;cursor:pointer}
button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#menu{max-width:980px;margin:0 auto;padding:28px 16px 40px;text-align:center}
#menu h1{font-size:clamp(24px,7vw,48px);margin:10px 0 6px;color:var(--gold);text-shadow:3px 3px 0 #b84a74}
#menu .sub{font-size:12px;opacity:.8;margin:0 0 26px}
#tg{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto 24px;padding:12px 26px;background:var(--card);border:3px solid var(--pink);border-radius:12px}
#tg .n{font-size:clamp(28px,8vw,44px);color:var(--gold);line-height:1.1}#tg .l{font-size:11px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gc{background:var(--card);color:var(--ink);border:3px solid #43376a;border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:170px}
.gc:hover{border-color:var(--gold);transform:translateY(-3px)}.gc.sp{border-color:var(--pink)}
.gc .ic{font-size:40px;line-height:1}.gc .nm{font-size:14px;color:var(--gold)}.gc .tg{font-size:10px;line-height:1.6;opacity:.85;flex:1}.gc .bs{font-size:10px;color:#7CFF9B}
#stage{display:flex;flex-direction:column;height:100dvh}
#bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(0,0,0,.35)}
#gt{color:var(--gold);font-size:13px}#info{margin-left:auto;font-size:12px}
#box{flex:1;min-height:0;position:relative;overflow:hidden}
#box>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.how{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(10,5,20,.82);border:2px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.5;text-align:center;max-width:92%;animation:fade 8s forwards;pointer-events:none;z-index:3}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.mem,.whack{position:absolute;inset:0;padding:12px;display:grid;gap:10px}
.mem{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.whack{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}
@media (min-aspect-ratio:9/5){.mem{grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(2,1fr)}.whack{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}}
.mem button,.whack button{font-size:clamp(28px,min(11vw,13vh),84px);background:var(--card);color:var(--ink);border:3px solid #43376a;border-radius:12px;padding:0;transition:transform .15s,background .15s}
.mem button.up{background:var(--ink);transform:scale(1.03)}.mem button.ok{background:#7CFF9B}.mem button.bad{animation:shake .3s}
.whack button{background:radial-gradient(#5a3a8a,#2b1850)}
.pop{animation:pop .18s}@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#bar button{padding:6px 12px;font-size:11px}
.echo{position:absolute;inset:0;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.echo button{border-radius:18px;border:0;padding:0;opacity:.42;transition:opacity .08s,transform .08s}.echo button.lit{opacity:1;transform:scale(.97);box-shadow:0 0 50px currentColor}
.ov2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,20,.6);padding:10px}
.card{background:rgba(43,24,80,.96);border:3px solid var(--gold);border-radius:8px;padding:18px 20px;max-width:380px;text-align:center;line-height:1.5}
.card h2{margin:0 0 8px;color:var(--gold);font-size:18px}.card p{font-size:12px;margin:6px 0 14px}
#hcw{position:fixed;inset:0;z-index:10;background:#000}
#hcf{width:100%;height:100%;border:0;display:block}
#hcm{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:11;padding:6px 12px;font-size:11px}
</style>
</head>
<body>
<main id="menu">
  <h1 id="mt"></h1>
  <p class="sub">pick a game. aha</p>
  <div id="tg" hidden></div>
  <div class="grid" id="grid"></div>
</main>
<section id="stage" hidden>
  <div id="bar"><button id="back">&#9664; Menu</button><span id="gt"></span><span id="info"></span><button id="fsb">Fullscreen</button></div>
  <div id="box"></div>
</section>
<div id="hcw" hidden><iframe id="hcf" allow="fullscreen" title="Homecoming Quest"></iframe><button id="hcm">&#9664; Menu</button></div>

<script>
const HC="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Homecoming Quest<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#1a0f2e;--card:#2b1850;--ink:#fff4e6;--gold:#ffcf5c;--pink:#ff7fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:#000;color:var(--ink);font-family:'Silkscreen','Courier New',monospace;height:100vh;height:100dvh;overflow:hidden}\nh1{display:none}\n#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}\ncanvas{display:block;background:#000;image-rendering:pixelated;touch-action:none}\n#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}\n#ov.hide{display:none}\n.card{background:rgba(43,24,80,.94);border:3px solid var(--gold);border-radius:8px;padding:18px 20px;max-width:440px;width:100%;text-align:center;line-height:1.5}\n.card h2{margin:0 0 8px;font-size:clamp(15px,3.4vw,22px);color:var(--gold)}\n.card p{margin:6px 0 12px;font-size:clamp(10px,2.3vw,13px)}\nbutton{font-family:inherit;font-size:13px;font-weight:700;background:var(--pink);color:#2b0f2b;border:0;border-bottom:4px solid #b84a74;border-radius:6px;padding:10px 18px;cursor:pointer}\nbutton:active{transform:translateY(2px)}\nbutton:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n#btns{display:flex;gap:10px;justify-content:center;align-items:center;min-height:50px;position:relative}\n#no{position:relative;background:#6a5a8c;border-bottom-color:#43376a;color:#fff;transition:transform .15s}\n#touch{display:none;position:fixed;left:10px;right:10px;bottom:60px;justify-content:space-between;opacity:.75;pointer-events:none}#touch button{pointer-events:auto}\n#touch button{width:76px;height:64px;font-size:22px}\n@media (pointer:coarse){#touch{display:flex}}\n.tip{font-size:10px;opacity:.7;margin:8px 0 0;text-align:center}\n#hintbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(26,15,46,.78)}#hintbar button{padding:6px 12px;font-size:11px}\n#ht{font-size:11px;line-height:1.5;flex:1;color:var(--gold)}\n.card b{font-size:22px;letter-spacing:3px;color:var(--gold);display:block;margin:10px 0}\n#pd{font-size:24px;letter-spacing:4px;background:#12091f;border:2px solid var(--pink);border-radius:4px;padding:8px;margin:6px 0 4px;min-height:44px;color:#7CFF9B;overflow:hidden}\n#kg{display:grid;gap:6px;margin:8px 0}#kg.n{grid-template-columns:repeat(5,1fr)}#kg.w{grid-template-columns:repeat(9,1fr)}\n.k{padding:8px 0;font-size:12px}.row{display:flex;gap:8px;justify-content:center}\n.card{max-height:92%;overflow:auto}\n#lg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}#lg button{font-size:10px;padding:8px 4px}\n<\/style>\n<\/head>\n<body>\n<h1>SABRYE'S HOMECOMING QUEST<\/h1>\n<div id=\"wrap\">\n  <canvas id=\"c\" width=\"640\" height=\"360\" aria-label=\"Platformer game\"><\/canvas>\n  <div id=\"ov\"><div class=\"card\" id=\"card\"><\/div><\/div>\n<\/div>\n<div id=\"touch\">\n  <div><button id=\"bl\" aria-label=\"Left\">&#9664;<\/button> <button id=\"br\" aria-label=\"Right\">&#9654;<\/button><\/div>\n  <button id=\"bj\" aria-label=\"Jump\">&#9650;<\/button>\n<\/div>\n<div id=\"hintbar\"><button id=\"hb\">Need a hint?<\/button><button id=\"lb\">Levels<\/button><button id=\"fs\">Fullscreen<\/button><div id=\"ht\" aria-live=\"polite\"><\/div><\/div>\n\n\n<script>\n/* ===== EDIT THESE ===== */\nconst HER = \"Sabrye\";\nconst FROM = \"Pierre\";\nconst DETAILS = \"ouuu shi the 16th?\";\n/* ====================== */\n\nconst C=document.getElementById('c'),g=C.getContext('2d'),H=360;let W=640;\nconst ov=document.getElementById('ov'),card=document.getElementById('card');\nconst ORDER=HER.toUpperCase().split('');\n\nconst atb=s=>s.replace(/[A-Z]/g,c=>String.fromCharCode(155-c.charCodeAt(0)));\nconst NUMS={ZERO:0,ONE:1,TWO:2,THREE:3,FOUR:4,FIVE:5,SIX:6,SEVEN:7,EIGHT:8,NINE:9};\nconst CODE3='CROWN',CODE1='DANCE',WORDS2='SIX ONE FIVE',CODE2=WORDS2.split(' ').map(w=>NUMS[w]).join('');\nconst LV=[\n {name:'LEVEL 1: HEART HUNT',intro:'Three hearts are hiding.',type:'h',w:1400,start:[40,280],gx:1230,goal:1330,\n  hints:['Not every heart sits on the ground.','Jump up onto the floating platforms.'],\n  plat:[[0,320,420,40],[500,320,300,40],[880,320,520,40],[200,250,80,14],[560,240,90,14],[700,180,80,14],[1000,240,100,14]],\n  items:[{t:'h',x:230,y:215},{t:'h',x:590,y:205},{t:'h',x:730,y:145}]},\n {name:'LEVEL 2: RIGHT OF WAY',intro:'These switches follow a rule of the road.',type:'s',w:1400,start:[40,280],gx:1230,goal:1330,\n  hints:['What do the colors on a street corner tell you to do?','Stop. Slow down. Go.','Red, then yellow, then green.'],\n  plat:[[0,320,500,40],[580,320,340,40],[1000,320,400,40],[260,250,80,14],[640,240,90,14],[780,180,70,14]],\n  items:[{t:'s',n:2,c:'#ffd84f',x:210,y:300},{t:'s',n:3,c:'#4fe36b',x:670,y:220},{t:'s',n:1,c:'#ff4f4f',x:1080,y:300}]},\n {name:'LEVEL 3: LOCKER NOTE',intro:'A note and a keypad are hiding here.',type:'k',mode:'word',code:CODE1,w:1400,start:[40,280],gx:1230,goal:1330,\n  hints:['Find the note first. The keypad is further along.','The note looks like gibberish because the alphabet is flipped.','A becomes Z, B becomes Y, C becomes X...','The word is something you are going to together.'],\n  plat:[[0,320,1400,40],[200,250,80,14],[340,190,90,14],[600,250,80,14]],\n  items:[{t:'n',x:380,y:165,text:'Found taped inside a locker:<b>'+atb(CODE1)+'<\/b>Mirror, mirror, on the wall. The keypad wants a word.'},{t:'p',x:1100,y:300}]},\n {name:'LEVEL 4: A NAME',intro:'Spell the name of the one you came for.',type:'l',w:1500,start:[40,280],gx:1330,goal:1430,\n  hints:['The letters belong to her name.','Watch the top right corner to see your progress.','Wrong letters do not hurt. Just try another.'],\n  plat:[[0,320,350,40],[440,320,200,40],[720,320,200,40],[1000,320,500,40],[150,240,80,14],[330,200,70,14],[520,230,80,14],[640,170,80,14],[820,230,80,14],[960,170,70,14],[1100,240,80,14]],\n  items:[]},\n {name:'LEVEL 5: BLEACHER CODE',intro:'Another note. Another keypad.',type:'k',mode:'num',code:CODE2,w:1400,start:[40,280],gx:1230,goal:1330,\n  hints:['Climb up to find the note.','Same trick as before: the alphabet in a mirror.','The decoded words are number names.','Type their digits on the keypad.'],\n  plat:[[0,320,1400,40],[150,260,80,14],[290,200,80,14],[430,140,90,14],[1000,240,110,14]],\n  items:[{t:'n',x:470,y:115,text:'Found under the bleachers:<b>'+atb(WORDS2)+'<\/b>The keypad only takes numbers.'},{t:'p',x:1050,y:215}]},\n {name:'LEVEL 6: SKY CLIMB',intro:'Five hearts. The last stretch.',type:'h',w:1500,start:[40,280],gx:1380,goal:1450,\n  hints:['The platforms go up, then back down.','Each heart sits above a platform.'],\n  plat:[[0,320,250,40],[300,270,70,14],[430,220,70,14],[560,170,70,14],[690,130,70,14],[830,190,70,14],[950,240,70,14],[1070,290,70,14],[1250,320,250,40]],\n  items:[{t:'h',x:465,y:185},{t:'h',x:595,y:135},{t:'h',x:725,y:95},{t:'h',x:865,y:155},{t:'h',x:985,y:205}]},\n {name:'LEVEL 7: FOUR SEASONS',intro:'The year goes around. So do these switches.',type:'s',w:1400,start:[40,280],gx:1230,goal:1330,\n  hints:['Four seasons, four colors.','Think: snow, sprouts, sunshine, falling leaves.','Start at New Year. Blue, green, yellow, orange.'],\n  plat:[[0,320,450,40],[530,320,300,40],[910,320,490,40],[150,250,80,14],[600,240,80,14],[720,180,70,14],[1000,240,90,14],[1150,190,70,14]],\n  items:[{t:'s',n:1,c:'#4fa8ff',x:640,y:220},{t:'s',n:2,c:'#4fe36b',x:190,y:230},{t:'s',n:3,c:'#ffd84f',x:1040,y:220},{t:'s',n:4,c:'#ff9a3c',x:1180,y:170}]},\n {name:'LEVEL 8: ROYAL CODE',intro:'A note on the gym door. A keypad past the bleachers.',type:'k',mode:'word',code:CODE3,w:1400,start:[40,280],gx:1230,goal:1330,\n  hints:['Climb up to find the note.','Same mirror trick: A becomes Z.','Homecoming royalty wears one on their head.'],\n  plat:[[0,320,1400,40],[180,260,80,14],[320,200,80,14],[460,140,90,14],[800,250,80,14]],\n  items:[{t:'n',x:500,y:115,text:'Taped inside the gym doors:<b>'+atb(CODE3)+'<\/b>Mirror again. What does royalty wear?'},{t:'p',x:1100,y:300}]},\n {name:'LEVEL 9: LEAP OF FAITH',intro:'Do not look down. Six hearts hang over the gaps.',type:'h',w:1500,start:[40,280],gx:1330,goal:1430,\n  hints:['Jump early and hold the direction.','Each heart hangs over a gap. Grab it mid-jump.'],\n  plat:[[0,320,160,40],[240,320,70,40],[390,320,70,40],[540,320,70,40],[690,320,70,40],[840,320,70,40],[990,320,70,40],[1140,320,360,40]],\n  items:[{t:'h',x:200,y:235},{t:'h',x:350,y:235},{t:'h',x:500,y:235},{t:'h',x:650,y:235},{t:'h',x:800,y:235},{t:'h',x:950,y:235}]},\n {name:'FINAL LEVEL',intro:'Someone is waiting for you...',type:'f',w:1400,start:[40,280],gx:0,goal:0,hints:[],\n  plat:[[0,320,1400,40],[300,250,90,14]],items:[]}\n];\n(function(){\n const spots=[[180,205],[350,165],[550,195],[670,135],[850,195],[1130,205],[390,285],[780,285],[1060,285],[1200,285]];\n LV.find(l=>l.type==='l').items=ORDER.map((ch,i)=>({t:'l',ch,x:spots[i%spots.length][0],y:spots[i%spots.length][1]}));\n})();\n\nlet li=0,lvl,P,cam=0,solved=false,got=0,next=0,toast='',tt=0,state='title',keys={},acc=0,last=0,shake=0,parts=[];\n\nfunction say(m,t=150){toast=m;tt=t}\nfunction load(i){\n li=i;lvl=JSON.parse(JSON.stringify(LV[i]));\n P={x:lvl.start[0],y:lvl.start[1],vx:0,vy:0,w:18,h:26,on:false,f:1};\n got=0;next=0;solved=lvl.type==='f';cam=0;hi=0;hideHint();lvl.nh=lvl.items.filter(i=>i.t==='h').length;lvl.ns=lvl.items.filter(i=>i.t==='s').length;\n say(lvl.intro,220);\n}\nfunction solids(){const s=lvl.plat.slice();if(!solved&&lvl.gx)s.push([lvl.gx,140,14,180]);return s}\nfunction hit(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}\n\nfunction step(){\n const L=keys.l||keys.a,R=keys.r||keys.d,J=keys.j;\n const sp=2.8;\n P.vx=(R?sp:0)-(L?sp:0);if(P.vx)P.f=P.vx>0?1:-1;\n if(J&&P.on){P.vy=-9.6;P.on=false}\n P.vy=Math.min(P.vy+.5,12);\n const S=solids();\n P.x+=P.vx;\n for(const r of S)if(hit(P,r)){if(P.vx>0)P.x=r[0]-P.w;else if(P.vx<0)P.x=r[0]+r[2]}\n P.x=Math.max(0,Math.min(lvl.w-P.w,P.x));\n P.y+=P.vy;P.on=false;\n for(const r of S)if(hit(P,r)){if(P.vy>0){P.y=r[1]-P.h;P.on=true}else if(P.vy<0)P.y=r[1]+r[3];P.vy=0}\n if(P.y>H+80){P.x=lvl.start[0];P.y=lvl.start[1];P.vy=0;say('Oops! Back to the start.',100)}\n // items\n for(const it of lvl.items){\n  if(it.done)continue;\n  if(it.cool>0){it.cool--;continue}\n  const inb=hit(P,[it.x-10,it.y-10,20,20]);\n  if(it.t==='n'||it.t==='p'){\n   if(!inb){it.armed=1;continue}\n   if(it.armed!==0){it.armed=0;it.t==='n'?openNote(it):openPad()}\n   continue}\n  if(!inb)continue;\n  if(it.t==='h'){it.done=1;got++;say('Heart '+got+' of '+lvl.nh+'!',80)}\n  else if(it.t==='s'){\n   if(it.n===next+1){it.done=1;next++;say('Click!',80)}\n   else{lvl.items.forEach(o=>{if(o.t==='s')o.done=0});next=0;it.cool=90;shake=12;say('Wrong order. The switches reset.',120)}\n  }else if(it.t==='l'){\n   if(it===lvl.items[next]){it.done=1;next++;say('\"'+it.ch+'\" collected!',60)}\n   else{it.cool=90;say('Not that one yet.',90)}\n  }\n }\n if(!solved&&((lvl.type==='h'&&got>=lvl.nh)||(lvl.type==='s'&&next>=lvl.ns)||(lvl.type==='l'&&next>=ORDER.length)||(lvl.type==='k'&&lvl.open))){solved=true;shake=10;say('Unlocked! Head right.',160)}\n if(lvl.type!=='f'&&solved&&P.x>lvl.goal-10){\n  if(li<2)say('Level cleared!',80);\n  load(li+1);\n }\n if(lvl.type==='f'&&P.x>560&&state==='play'){state='ask';showAsk()}\n cam=Math.max(0,Math.min(lvl.w-W,P.x-W/2));\n if(tt>0)tt--;if(shake>0)shake--;\n}\n\n/* ===== drawing ===== */\nconst stars=Array.from({length:60},(_,i)=>[(i*97)%6   g.textAlign='center';g.font='28px serif';let dead=false;
  obs.forEach(o=>{for(let i=0;i<o.n;i++)g.fillText(o.e,o.x+i*26,GY);
   if(px+12>o.x-12&&px-12<o.x+(o.n-1)*26+12&&y<24)dead=true});
  g.save();g.translate(px,GY-y);g.scale(-1,1);g.rotate(-vy*.02);g.font='34px serif';g.fillText('🐕',0,0);g.restore();
  g.globalAlpha=.85;g.fillStyle='#fff4e6';g.font='bold 40px monospace';g.fillText(m+' m',W/2,60);g.globalAlpha=1;
  if(!go){g.font='bold 14px monospace';g.fillText('Tap or press Space to run and jump',W/2,H/2)}
  a.info('Distance '+m+' m');
  if(dead){const nb=a.best('dash',m);a.over('Zoomies over!','You ran '+m+' meters.'+(nb?' New best!':''))}
 });
}

/* ---- Whack-a-Cat ---- */
function whack(a){
 const hs=[],st=[],w=document.createElement('div');w.className='whack';let sc=0,t0=null,next=0,left=30;
 const upd=()=>a.info('Score '+sc+'  Time '+Math.max(0,Math.ceil(left))),anim=b=>{b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')};
 for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent='🕳️';hs.push(b);st.push({e:'',until:0});
  b.onclick=()=>{const s=st[i];if(!s.e)return;const p={'🐱':1,'😻':3,'🐶':-2}[s.e];sc=Math.max(0,sc+p);
   b.textContent=p<0?'💥':'⭐';s.e='';anim(b);a.after(()=>{if(!st[i].e)b.textContent='🕳️'},260);upd()};
  w.appendChild(b)}
 a.box.appendChild(w);upd();
 a.loop(now=>{
  if(t0===null)t0=now;const el=(now-t0)/1000;left=30-el;
  st.forEach((s,i)=>{if(s.e&&now>s.until){s.e='';hs[i].textContent='🕳️'}});
  if(now>next){next=now+Math.max(330,800-el*14);const free=st.map((s,i)=>s.e?-1:i).filter(i=>i>=0);
   if(free.length){const i=free[Math.random()*free.length|0],r=Math.random(),e=r<.14?'🐶':r<.22?'😻':'🐱';
    st[i].e=e;st[i].until=now+Math.max(600,1200-el*20);hs[i].textContent=e;anim(hs[i])}}
  upd();
  if(left<=0){const nb=a.best('whack',sc);a.over('Time!','You scored '+sc+'.'+(nb?' New best!':''))}
 });
}

function renderTogether(){
 const [y,m,d]=TOGETHER_SINCE,s=new Date(y,m-1,d),n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate()),days=Math.round((today-s)/864e5),el=$('#tg');
 if(days<0){el.hidden=true;return}
 el.hidden=false;el.innerHTML='<span class="l">&#10084; together for</span><span class="n">'+days+' day'+(days===1?'':'s')+'</span><span class="l">since '+m+'/'+d+(days>0&&days%100===0?' &middot; what a milestone!':'')+'</span>';
}
function renderMenu(){
 renderTogether();
 $('#mt').textContent=ARCADE_TITLE;
 $('#grid').innerHTML=GAMES.map(g=>{const b=g.id==='hc'?0:store.get(g.id);
  return '<button class="gc'+(g.sp?' sp':'')+'" data-id="'+g.id+'"><span class="ic">'+g.icon+'</span><span class="nm">'+g.name+'</span><span class="tg">'+g.tag+'</span><span class="bs">'+(b?'Best: '+b+(g.low?' moves':''):'&nbsp;')+'</span></button>'}).join('');
 document.querySelectorAll('.gc').forEach(b=>b.onclick=()=>launch(GAMES.find(g=>g.id===b.dataset.id)));
}
function launch(g){
 if(g.id==='hc'){$('#menu').hidden=true;$('#hcw').hidden=false;const f=$('#hcf');f.onload=()=>f.contentWindow.focus();f.srcdoc=HC;return}
 if(api)api.stop();cur=g;$('#menu').hidden=true;$('#stage').hidden=false;$('#gt').textContent=g.name;
 const box=$('#box');box.innerHTML='';const hw=document.createElement('div');hw.className='how';hw.textContent=g.how;box.appendChild(hw);api=Api(box);api.info('');g.run(api);
}
function toMenu(){if(api)api.stop();api=null;$('#hcf').srcdoc='';$('#hcw').hidden=true;$('#stage').hidden=true;$('#menu').hidden=false;renderMenu()}
$('#back').onclick=toMenu;
$('#fsb').onclick=function(){this.blur();const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#stage').hidden)toMenu()});$('#hcm').onclick=toMenu;
renderMenu();
</script>
